<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matias — Music</title>
<style>
:root{--bg:#080808;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.13);--muted:#a7a7a7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:
linear-gradient(135deg,rgba(255,255,255,.04),transparent 35%),
radial-gradient(circle at 50% -5%,#333 0,#121212 32%,#070707 72%);display:flex;justify-content:center}
.page{width:min(92%,460px);padding:48px 0 35px;text-align:center}
.logo{width:96px;height:96px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
background:linear-gradient(145deg,#303030,#111);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:38px}
h1{margin:18px 0 5px;font-size:30px;letter-spacing:-.5px}
.handle{margin:0;color:var(--muted);font-size:15px}
.intro{margin:22px 0 28px;color:#d7d7d7;font-size:14px}
.links{display:grid;gap:14px}
.card{position:relative;display:flex;align-items:center;text-align:left;gap:15px;padding:15px 17px;
border:1px solid var(--line);border-radius:18px;background:var(--card);backdrop-filter:blur(14px);
color:#fff;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:.2s}
.card:hover{transform:translateY(-2px);background:rgba(255,255,255,.11)}
.icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;
background:#191919;border:1px solid var(--line);font-size:23px;flex:none}
.info{min-width:0}.label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{margin-left:auto;font-size:22px;color:#aaa}
.footer{margin-top:30px;color:#777;font-size:12px}
</style>
</head>
<body>
<main class="page">
  <div class="logo">🎵</div>
  <h1>Matias</h1>
  <p class="handle">Music • Songs • Faith</p>
  <p class="intro">Ascultă cele mai noi piese ale mele 🤍</p>

  <div class="links">
    <a class="card" href="https://youtu.be/ySEsa33kgbI" target="_blank" rel="noopener">
      <div class="icon">🎵</div>
      <div class="info"><div class="label">YouTube • New Song</div><div class="title">Mâna Ta</div></div>
      <div class="arrow">›</div>
    </a>

    <a class="card" href="https://youtu.be/KVMaLFDkl-Q" target="_blank" rel="noopener">
      <div class="icon">🎧</div>
      <div class="info"><div class="label">YouTube • Song</div><div class="title">Gândul veșniciei</div></div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="footer">Mulțumesc că asculți 🤍</div>
</main>
</body>
</html>
