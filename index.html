<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matias — Music</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Georgia, "Times New Roman", serif;
    color:white;
    background:
        radial-gradient(circle at 75% 20%, rgba(255,190,100,.28), transparent 30%),
        linear-gradient(180deg,#26313a 0%,#111820 45%,#050709 100%);
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.65)),
        radial-gradient(circle at 80% 30%,#e7a75e 0%,transparent 18%);
    pointer-events:none;
}

.page{
    position:relative;
    z-index:1;
    max-width:1000px;
    margin:auto;
    padding:45px 25px 35px;
    text-align:center;
}

/* HEADER */

.logo{
    font-family:Arial,sans-serif;
    font-size:30px;
    letter-spacing:12px;
    margin-bottom:20px;
}

.line{
    width:70px;
    height:1px;
    background:rgba(255,255,255,.7);
    margin:0 auto 35px;
}

.tagline{
    font-family:Arial,sans-serif;
    font-size:13px;
    letter-spacing:7px;
    color:#aaa;
    margin-bottom:70px;
}

/* SONGS */

.songs{
    display:flex;
    justify-content:center;
    gap:70px;
    flex-wrap:wrap;
}

.song{
    width:300px;
}

.cover{
    width:290px;
    height:290px;
    border-radius:15px;
    overflow:hidden;
    margin:auto;
    background:
        linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.65)),
        linear-gradient(135deg,#8c735b,#20282c);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.cover-title{
    font-size:28px;
    letter-spacing:2px;
}

.song h2{
    margin:25px 0 8px;
    font-size:25px;
    font-weight:normal;
}

.artist{
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:5px;
    color:#999;
}

/* BUTTON */

.button{
    display:inline-flex;
    align-items:center;
    gap:12px;
    margin-top:25px;
    padding:16px 28px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:30px;
    color:white;
    text-decoration:none;
    font-family:Arial,sans-serif;
    font-size:15px;
    background:rgba(0,0,0,.35);
    transition:.25s;
}

.button:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.1);
}

.youtube{
    width:22px;
    height:16px;
    border-radius:5px;
    background:#ff0000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

/* SOCIAL */

.social{
    margin-top:70px;
    display:flex;
    justify-content:center;
    gap:35px;
}

.social a{
    color:white;
    text-decoration:none;
    font-family:Arial,sans-serif;
    font-size:14px;
    opacity:.9;
}

.social a:hover{
    opacity:.6;
}

/* FOOTER */

.footer-line{
    width:70px;
    height:1px;
    background:rgba(255,255,255,.5);
    margin:70px auto 30px;
}

.footer{
    color:#aaa;
    font-size:17px;
    letter-spacing:.5px;
}

/* MOBILE */

@media(max-width:700px){

    .page{
        padding-top:35px;
    }

    .tagline{
        letter-spacing:4px;
        font-size:11px;
        margin-bottom:50px;
    }

    .songs{
        gap:55px;
    }

    .song{
        width:100%;
    }

    .cover{
        width:270px;
        height:270px;
    }

    .logo{
        font-size:26px;
    }

}

</style>
</head>


<body>

<main class="page">

    <div class="logo">
        MATIAS
    </div>

    <div class="line"></div>

    <div class="tagline">
        MUSIC · FAITH · A HIGHER PURPOSE
    </div>


    <section class="songs">

        <!-- MÂNA TA -->

        <div class="song">

            <div class="cover">
                <div class="cover-title">
                    MÂNA TA
                </div>
            </div>

            <h2>Mâna Ta</h2>

            <div class="artist">
                MATIAS
            </div>

            <a
                class="button"
                href="https://youtu.be/ySEsa33kgbI"
                target="_blank"
            >
                <span class="youtube">▶</span>
                Watch on YouTube
            </a>

        </div>


        <!-- GÂNDUL VEȘNICIEI -->

        <div class="song">

            <div class="cover">
                <div class="cover-title">
                    GÂNDUL VEȘNICIEI
                </div>
            </div>

            <h2>Gândul veșniciei</h2>

            <div class="artist">
                MATIAS
            </div>

            <a
                class="button"
                href="https://youtu.be/KVMaLFDkl-Q"
                target="_blank"
            >
                <span class="youtube">▶</span>
                Watch on YouTube
            </a>

        </div>

    </section>


    <div class="social">

        <a href="#" target="_blank">
            Instagram
        </a>

        <a href="https://www.youtube.com/" target="_blank">
            YouTube
        </a>

        <a href="#" target="_blank">
            Spotify
        </a>

    </div>


    <div class="footer-line"></div>


    <div class="footer">
        Nu prin puterea mea, ci ținut de mâna Lui. 🤍
    </div>

</main>

</body>
</html>
