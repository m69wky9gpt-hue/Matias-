<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MATIAS — Music</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    color: white;
    font-family: Georgia, "Times New Roman", serif;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.48),
            rgba(0,0,0,0.78)
        ),
        url("https://m69wky9gpt-hue.github.io/Matias-/bg.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
}


/* PAGINA */

.page {
    width: 90%;
    max-width: 900px;

    margin: auto;

    padding: 45px 0 120px;

    text-align: center;
}


/* NAV */

.nav {
    text-align: right;

    font-family: Arial, sans-serif;
    font-size: 10px;

    letter-spacing: 5px;

    color: #ddd;

    margin-bottom: 55px;
}


/* MATIAS */

.logo {
    font-family: Arial, sans-serif;

    font-size: 29px;

    letter-spacing: 12px;

    font-weight: 300;

    text-shadow: 0 3px 20px #000;
}

.line {
    width: 62px;
    height: 1px;

    margin: 20px auto 48px;

    background: rgba(255,255,255,0.7);
}


/* TITLU */

.headline {
    margin: 0 0 25px;

    font-size: clamp(40px, 7vw, 64px);

    line-height: 1.02;

    font-weight: normal;

    text-shadow: 0 3px 22px #000;
}


/* SUBTITLU */

.tagline {
    margin-bottom: 65px;

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 6px;

    color: #d0d0d0;
}


/* MELODII */

.songs {
    display: flex;

    flex-direction: column;

    gap: 24px;

    width: 100%;
}


/* CARD */

.song-card {
    width: 100%;

    min-height: 145px;

    display: flex;

    align-items: center;

    padding: 15px 25px 15px 18px;

    border: 1px solid rgba(255,255,255,0.32);

    border-radius: 17px;

    background: rgba(0,0,0,0.48);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
}


/* POZA CARD */

.cover {
    width: 112px;
    height: 112px;

    flex-shrink: 0;

    border-radius: 12px;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.55)
        ),
        url("https://m69wky9gpt-hue.github.io/Matias-/bg.jpg");

    background-size: cover;

    background-position: center;

    border: 1px solid rgba(255,255,255,0.2);
}


/* TEXT MELODIE */

.song-info {
    flex: 1;

    text-align: left;

    padding-left: 30px;
}

.song-title {
    font-size: 29px;

    line-height: 1.15;

    margin-bottom: 12px;
}

.artist {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;

    color: #aaa;
}


/* BUTON PLAY */

.play {
    width: 74px;
    height: 74px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,0.8);

    border-radius: 50%;

    color: white;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 24px;
}


/* YOUTUBE JOS STÂNGA */

.youtube {
    position: fixed;

    left: 28px;
    bottom: 24px;

    z-index: 10;

    display: flex;

    align-items: center;

    gap: 12px;

    color: white;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;
}

.youtube-icon {
    width: 31px;
    height: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #ff0000;

    border-radius: 6px;

    font-size: 12px;
}


/* TEXT JOS DREAPTA */

.footer {
    position: fixed;

    right: 28px;
    bottom: 24px;

    z-index: 10;

    color: #ddd;

    text-align: right;

    font-family: Arial, sans-serif;

    font-size: 10px;

    line-height: 1.7;

    letter-spacing: 4px;

    text-shadow: 0 2px 10px #000;
}


/* TELEFON */

@media (max-width: 700px) {

    body {
        background-attachment: scroll;
    }

    .page {
        width: 90%;

        padding-top: 35px;
    }

    .nav {
        display: none;
    }

    .logo {
        font-size: 25px;

        letter-spacing: 8px;
    }

    .headline {
        font-size: 43px;
    }

    .tagline {
        font-size: 9px;

        letter-spacing: 3px;

        margin-bottom: 45px;
    }

    .song-card {
        min-height: 115px;

        padding: 12px 15px;
    }

    .cover {
        width: 78px;
        height: 78px;
    }

    .song-info {
        padding-left: 16px;
    }

    .song-title {
        font-size: 20px;
    }

    .artist {
        font-size: 8px;

        letter-spacing: 3px;
    }

    .play {
        width: 52px;
        height: 52px;

        font-size: 18px;
    }

    .youtube {
        left: 18px;
        bottom: 18px;
    }

    .footer {
        right: 18px;
        bottom: 18px;

        font-size: 7px;

        letter-spacing: 2px;
    }
}

</style>
</head>


<body>

<div class="page">


    <div class="nav">
        HOME &nbsp;&nbsp;&nbsp; MUSIC &nbsp;&nbsp;&nbsp; ABOUT
    </div>


    <div class="logo">
        MATIAS
    </div>


    <div class="line"></div>


    <h1 class="headline">
        Cant pentru<br>
        cel ce m-a salvat
    </h1>


    <div class="tagline">
        MUZICĂ · CREDINȚĂ · SPERANȚĂ
    </div>


    <section class="songs">


        <!-- MÂNA TA -->

        <div class="song-card">

            <div class="cover"></div>

            <div class="song-info">

                <div class="song-title">
                    Mâna Ta
                </div>

                <div class="artist">
                    MATIAS
                </div>

            </div>

            <a
                class="play"
                href="https://youtu.be/ySEsa33kgbI"
                target="_blank"
            >
                ▶
            </a>

        </div>


        <!-- GÂNDUL VEȘNICIEI -->

        <div class="song-card">

            <div class="cover"></div>

            <div class="song-info">

                <div class="song-title">
                    Gândul veșniciei
                </div>

                <div class="artist">
                    MATIAS
                </div>

            </div>

            <a
                class="play"
                href="https://youtu.be/KVMaLFDkl-Q"
                target="_blank"
            >
                ▶
            </a>

        </div>


    </section>

</div>


<!-- YOUTUBE JOS STÂNGA -->

<a
    class="youtube"
    href="https://youtu.be/ySEsa33kgbI"
    target="_blank"
>

    <span class="youtube-icon">
        ▶
    </span>

    YOUTUBE

</a>


<!-- MESAJ JOS DREAPTA -->

<div class="footer">

    NU PRIN PUTEREA MEA<br>
    CI ȚINUT DE MÂNA LUI

</div>


</body>
</html>
