<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matias — Music</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    color:#fff;
    font-family:Georgia,"Times New Roman",serif;

    background:
        #050505
        url("bg.jpg")
        center center / cover
        fixed
        no-repeat;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.48),
            rgba(0,0,0,.76)
        );

    pointer-events:none;
}

.page{
    position:relative;
    z-index:1;

    width:min(92%,900px);
    margin:auto;

    padding:48px 0 38px;

    text-align:center;
}


/* MATIAS */

.logo{
    font-family:Arial,sans-serif;

    font-size:28px;
    letter-spacing:11px;
    font-weight:300;

    text-shadow:
        0 2px 15px #000;
}

.line{
    width:62px;
    height:1px;

    margin:20px auto 30px;

    background:rgba(255,255,255,.7);
}


/* TITLU */

.headline{
    font-size:clamp(38px,7vw,64px);

    line-height:1.02;

    font-weight:normal;

    margin:0 auto 18px;

    text-shadow:
        0 3px 20px rgba(0,0,0,.9);
}


/* SUBTITLU */

.tagline{
    font-family:Arial,sans-serif;

    font-size:11px;

    letter-spacing:5px;

    color:#d0d0d0;

    margin-bottom:58px;
}


/* MELODII */

.songs{
    display:flex;

    justify-content:center;

    gap:42px;

    flex-wrap:wrap;
}

.song{
    width:300px;
}


/* COVER */

.cover{
    width:290px;
    height:290px;

    margin:auto;

    border-radius:17px;

    overflow:hidden;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.86),
            rgba(0,0,0,.08)
        ),
        url("bg.jpg")
        center / cover;

    border:1px solid rgba(255,255,255,.22);

    box-shadow:
        0 24px 55px rgba(0,0,0,.65);

    transition:.3s;
}

.cover:hover{
    transform:translateY(-5px);

    box-shadow:
        0 30px 65px rgba(0,0,0,.8);
}

.cover-title{
    margin-bottom:24px;

    font-size:25px;

    letter-spacing:2px;

    text-shadow:
        0 3px 15px #000;
}


/* NUMELE MELODIILOR */

.song h2{
    margin:20px 0 7px;

    font-size:23px;

    font-weight:normal;
}

.artist{
    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:5px;

    color:#aaa;
}


/* BUTON */

.button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:11px;

    margin-top:21px;

    padding:13px 25px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:30px;

    color:#fff;

    text-decoration:none;

    font-family:Arial,sans-serif;

    font-size:14px;

    background:rgba(0,0,0,.48);

    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);

    transition:.25s;
}

.button:hover{
    transform:translateY(-3px);

    background:rgba(255,255,255,.12);
}


/* YOUTUBE */

.youtube{
    width:20px;
    height:15px;

    border-radius:4px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#f00;

    font-size:9px;
}


/* JOS */

.footer-line{
    width:62px;
    height:1px;

    margin:62px auto 27px;

    background:rgba(255,255,255,.5);
}

.footer{
    color:#d0d0d0;

    font-size:16px;

    line-height:1.65;

    text-shadow:
        0 2px 14px #000;
}

.prayer{
    display:block;

    margin-top:10px;

    font-size:20px;
}


/* TELEFON */

@media(max-width:700px){

    body{
        background-attachment:scroll;
    }

    .page{
        width:90%;

        padding-top:36px;
    }

    .logo{
        font-size:25px;

        letter-spacing:8px;
    }

    .headline{
        font-size:43px;
    }

    .tagline{
        font-size:9px;

        letter-spacing:3px;

        margin-bottom:43px;
    }

    .songs{
        gap:48px;
    }

    .cover{
        width:275px;
        height:275px;
    }

    .footer{
        font-size:15px;
    }

}

</style>
</head>


<body>

<main class="page">


    <!-- NUMELE -->

    <div class="logo">
        MATIAS
    </div>


    <div class="line"></div>


    <!-- TITLU -->

    <h1 class="headline">
        Cant pentru<br>
        cel ce m-a salvat
    </h1>


    <!-- SUBTITLU -->

    <div class="tagline">
        MUZICĂ · CREDINȚĂ · SPERANȚĂ
    </div>


    <!-- MELODII -->

    <section class="songs">


        <!-- MÂNA TA -->

        <div class="song">

            <div class="cover">

                <div class="cover-title">
                    Mâna Ta
                </div>

            </div>


            <h2>
                Mâna Ta
            </h2>


            <div class="artist">
                MATIAS
            </div>


            <a
                class="button"
                href="https://youtu.be/ySEsa33kgbI"
                target="_blank"
            >

                <span class="youtube">
                    ▶
                </span>

                Ascultă acum

            </a>

        </div>



        <!-- GÂNDUL VEȘNICIEI -->

        <div class="song">

            <div class="cover">

                <div class="cover-title">
                    Gândul veșniciei
                </div>

            </div>


            <h2>
                Gândul veșniciei
            </h2>


            <div class="artist">
                MATIAS
            </div>


            <a
                class="button"
                href="https://youtu.be/KVMaLFDkl-Q"
                target="_blank"
            >

                <span class="youtube">
                    ▶
                </span>

                Ascultă acum

            </a>

        </div>


    </section>



    <!-- MESAJ FINAL -->

    <div class="footer-line"></div>


    <div class="footer">

        Nu prin puterea mea,<br>
        ci ținut de mâna lui

        <span class="prayer">
            🙏
        </span>

    </div>


</main>

</body>
</html>
