<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matias — Music</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:white;
display:flex;
justify-content:center;
background:
radial-gradient(circle at 50% -10%,#444 0,#151515 35%,#050505 80%);
}

.page{
width:min(92%,460px);
padding:55px 0 35px;
text-align:center;
}

.logo{
width:100px;
height:100px;
margin:auto;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
background:linear-gradient(145deg,#383838,#101010);
border:1px solid rgba(255,255,255,.18);
box-shadow:0 20px 55px rgba(0,0,0,.6);
}

h1{
margin:18px 0 5px;
font-size:30px;
}

.handle{
margin:0;
color:#aaa;
font-size:15px;
}

.intro{
margin:25px 0 30px;
color:#ddd;
font-size:15px;
}

.links{
display:grid;
gap:15px;
}

.card{
display:flex;
align-items:center;
gap:15px;
padding:16px;
text-align:left;
text-decoration:none;
color:white;
border:1px solid rgba(255,255,255,.15);
border-radius:19px;
background:rgba(255,255,255,.075);
box-shadow:0 12px 35px rgba(0,0,0,.25);
transition:.2s;
}

.card:hover{
transform:translateY(-2px);
background:rgba(255,255,255,.12);
}

.icon{
width:52px;
height:52px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
background:#191919;
border:1px solid rgba(255,255,255,.13);
font-size:24px;
flex:none;
}

.info{
min-width:0;
}

.label{
font-size:10px;
color:#999;
text-transform:uppercase;
letter-spacing:1.2px;
margin-bottom:5px;
}

.title{
font-size:17px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.arrow{
margin-left:auto;
font-size:25px;
color:#999;
}

.footer{
margin-top:32px;
color:#777;
font-size:12px;
}
</style>
</head>

<body>

<main class="page">

<div class="logo">🎵</div>

<h1>Matias</h1>

<p class="handle">Music • Songs • Faith</p>

<p class="intro">
Ascultă cele mai noi piese ale mele 🤍
</p>

<div class="links">

<a class="card"
href="https://youtu.be/ySEsa33kgbI"
target="_blank">

<div class="icon">🎵</div>

<div class="info">
<div class="label">YouTube • New Song</div>
<div class="title">Mâna Ta</div>
</div>

<div class="arrow">›</div>

</a>


<a class="card"
href="https://youtu.be/KVMaLFDkl-Q"
target="_blank">

<div class="icon">🎧</div>

<div class="info">
<div class="label">YouTube • Song</div>
<div class="title">Gândul veșniciei</div>
</div>

<div class="arrow">›</div>

</a>

</div>

<div class="footer">
Mulțumesc că asculți 🤍
</div>

</main>

</body>
</html>
